version: 2
updates:
  # 1. Monitor Node.js dependencies (npm)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    # Group minor and patch updates together to prevent PR spam
    groups:
      production-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # 2. Monitor GitHub Actions workflow versions for security
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"