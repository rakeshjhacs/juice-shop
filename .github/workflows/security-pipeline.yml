name: DevSecOps Security Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  secops-scan:
    name: Automated Security Assessment
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      security-events: write # Required for uploading SARIF files to GitHub Security tab

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. SECRET SCANNING (Gitleaks)
      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ""

      # 2. STATIC APPLICATION SECURITY TESTING / SAST (Semgrep)
      - name: Run Semgrep SAST Scan
        uses: returntocorp/semgrep-action@v1
        continue-on-error: true
        with:
          config: p/security-audit
          generate-sarif: "true"

      # 3. SOFTWARE COMPOSITION ANALYSIS / SCA (Node NPM Audit)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Generate Lock File & Run NPM Audit
        continue-on-error: true
        run: |
          npm install --package-lock-only
          npm audit --audit-level=high || true

      # 4. CONTAINER SECURITY & OS/PACKAGE VULNERABILITIES (Trivy)
      - name: Run Trivy vulnerability scanner in repo mode
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: 'fs'
          security-checks: 'vuln,config,secret'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'