# 4. REPOSITORY SECURITY POSTURE & COMPLIANCE (Prowler)
      - name: Run Prowler Security Assessment
        continue-on-error: true
        run: |
          pip install prowler
          prowler github --fixed-severity high,critical -M sarif -o prowler-results || true

      - name: Upload Prowler Results to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: prowler-results/prowler-output.sarif