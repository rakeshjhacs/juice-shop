name: OWASP ZAP Security Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual triggering

jobs:
  zap_scan:
    name: Run ZAP DAST Scan
    runs-on: ubuntu-latest

    # Spin up Juice Shop locally inside the runner network for testing
    services:
      juiceshop:
        image: bkimminich/juice-shop:latest
        ports:
          - 3000:3000

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Wait for Juice Shop to start
        run: |
          echo "Waiting for Juice Shop to be ready..."
          until curl -s http://localhost:3000/#/; do
            sleep 5
          done
          echo "Juice Shop is up and running!"

      - name: Run OWASP ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.12.0 # You can use action-baseline for faster passive scans
        with:
          target: 'http://localhost:3000'
          rules_file_name: '' # Optional: custom ZAP rules configuration
          cmd_options: '-a'   # Optional: include AJAX spider for modern SPAs
          allow_issue_writing: false

      - name: Upload ZAP Report
        if: always() # Ensures the report is uploaded even if the scan flags vulnerabilities and fails the job
        uses: actions/upload-artifact@v7
        with:
          name: zap-scan-report
          path: report.html